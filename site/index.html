function translateText(text){
  if(state.locale!==&#x27;en&#x27;)return text;
  let out=text;

  const placeholders=[];
  for(const [ko,en] of translationPairs){
    if(out.includes(ko)){const key=&#x27;\uE000&#x27;+placeholders.length+&#x27;\uE001&#x27;;placeholders.push(en);out=out.split(ko).join(key);}

}

    if(el.closest(&#x27;.language-switch&#x27;)||el===root)return;

function define(){return heading(&#x27;PROBLEM DEFINITION&#x27;,&#x27;문제 정의 · 계산 조건&#x27;,&#x27;표면 메커니즘 가설을 명시하고 VASP / QE에 전달할 공통 조건을 설정합니다.&#x27;)+flow()+`&lt;div class=&quot;split&quot;&gt;&lt;div&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;연구 질문과 구조&lt;/h2&gt;${input(&#x27;problem&#x27;,&#x27;문제 정의&#x27;)}&lt;div class=&quot;fields&quot;&gt;${select(&#x27;task&#x27;,&#x27;계산 종류&#x27;,[[&#x27;relax&#x27;,&#x27;표면 구조 최적화&#x27;],[&#x27;scf&#x27;,&#x27;단일점 에너지&#x27;],[&#x27;neb&#x27;,&#x27;반응 경로 · NEB&#x27;]])}${select(&#x27;engine&#x27;,&#x27;계산 엔진&#x27;,[&#x27;VASP&#x27;,&#x27;Quantum ESPRESSO&#x27;])}&lt;/div&gt;&lt;label&gt;비교할 구조&lt;p class=&quot;small&quot; data-user-content&gt;${esc(state.structure.startsWith(&#x27;H-terminated diamond (100)-2×1 ·&#x27;)?translateText(state.structure):state.structure)}&lt;/p&gt;&lt;input type=&quot;file&quot; id=&quot;sl-structure&quot; accept=&quot;.vasp,.cif,.xyz,.in,.poscar&quot;&gt;&lt;/label&gt;&lt;div class=&quot;fields&quot;&gt;${select(&#x27;nsite&#x27;,&#x27;질소 위치&#x27;,[&#x27;표면 매입 N&#x27;,&#x27;표면 아래 치환 N&#x27;,&#x27;흡착 N/NHₓ&#x27;,&#x27;N-free&#x27;])}${input(&#x27;vacuum&#x27;,&#x27;진공층 (Å)&#x27;,&#x27;number&#x27;,&#x27;min=&quot;5&quot;&#x27;)}${input(&#x27;layers&#x27;,&#x27;Slab 층수&#x27;,&#x27;number&#x27;,&#x27;min=&quot;2&quot;&#x27;)}${input(&#x27;base&#x27;,&#x27;고정할 하부 층수&#x27;,&#x27;number&#x27;,&#x27;min=&quot;0&quot;&#x27;)}&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;N-free / N-containing 쌍 비교 계획 · 구조 업로드는 파일명만 표시하는 목업&lt;/p&gt;${state.task===&#x27;neb&#x27;?&#x27;&lt;div class=&quot;notice&quot;&gt;NEB: 최적화된 초기·최종 구조, 동일한 원자 순서·셀, 이미지 수, 경로 보간·TS 검증이 추가로 필요합니다.&lt;/div&gt;&#x27;:&#x27;&#x27;}&lt;/section&gt;&lt;/div&gt;&lt;div&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;전자구조 · 수렴 조건&lt;/h2&gt;&lt;div class=&quot;fields&quot;&gt;${select(&#x27;xc&#x27;,&#x27;교환·상관 함수&#x27;,[&#x27;PBE&#x27;,&#x27;HSE06&#x27;])}${select(&#x27;spin&#x27;,&#x27;Spin 채널&#x27;,[[&#x27;1&#x27;,&#x27;비편극&#x27;],[&#x27;2&#x27;,&#x27;Spin-polarized&#x27;]])}${input(&#x27;charge&#x27;,&#x27;셀 총전하 (e)&#x27;,&#x27;number&#x27;)}${input(&#x27;k&#x27;,&#x27;k-point grid&#x27;)}${input(&#x27;cutoff&#x27;,state.engine===&#x27;VASP&#x27;?&#x27;ENCUT (eV)&#x27;:&#x27;ecutwfc (Ry)&#x27;,&#x27;number&#x27;,&#x27;min=&quot;1&quot;&#x27;)}${state.engine===&#x27;Quantum ESPRESSO&#x27;?input(&#x27;rho&#x27;,&#x27;ecutrho (Ry)&#x27;,&#x27;number&#x27;,&#x27;min=&quot;1&quot;&#x27;):&#x27;&#x27;}${input(&#x27;scf&#x27;,state.engine===&#x27;VASP&#x27;?&#x27;EDIFF (eV)&#x27;:&#x27;conv_thr (Ry)&#x27;)}${input(&#x27;force&#x27;,&#x27;힘 수렴 기준 (eV/Å)&#x27;,&#x27;number&#x27;,&#x27;step=&quot;0.005&quot; min=&quot;0.001&quot;&#x27;)}&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;표시값은 입력 UI 예시입니다. 문헌 재현값이나 수렴이 검증된 권장값이 아닙니다.&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;확장 입력: 원자별 초기 자화, N 피복률, dipole correction, smearing, 표면 전하 보정, pseudopotential 버전&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;panel&quot;&gt;&lt;h2&gt;연결된 근거&lt;/h2&gt;&lt;p&gt;${esc(state.selected)} · ${esc((sources.find(x=&gt;x.id===state.selected)||sources[0]).kind)}&lt;/p&gt;&lt;p class=&quot;small&quot;&gt;계산의 가정·조건은 결과와 함께 보존&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;row&quot;&gt;${go(&#x27;inputs&#x27;,&#x27;입력 파일 생성으로 →&#x27;,true)}${go(&#x27;db&#x27;,&#x27;문헌 확인&#x27;)}&lt;/div&gt;`;}
function makeFiles(){const v=state.engine===&#x27;VASP&#x27;,relax=state.task===&#x27;relax&#x27;,neb=state.task===&#x27;neb&#x27;,force=Number(state.force),common={};if(v){common.INCAR=[&#x27;# DRAFT ONLY: structure and POTCAR not yet registered&#x27;,`SYSTEM = Diamond_N_surface_${state.task}`,`ENCUT = ${state.cutoff}`,`EDIFF = ${state.scf}`,`EDIFFG = -${force}`,`ISPIN = ${state.spin}`,&#x27;# NELECT: derive from POTCAR valence sum and requested charge&#x27;,`# requested charge = ${state.charge} e`,`GGA = PE`,...(state.xc===&#x27;HSE06&#x27;?[&#x27;LHFCALC = .TRUE.&#x27;,&#x27;HFSCREEN = 0.2&#x27;,&#x27;AEXX = 0.25&#x27;]:[]),`IBRION = ${neb?3:relax?2:-1}`,`NSW = ${relax||neb?200:0}`,&#x27;ISIF = 2&#x27;,...(neb?[&#x27;IMAGES = 5&#x27;,&#x27;SPRING = -5&#x27;,&#x27;POTIM = 0&#x27;,&#x27;# NEB optimizer and image folders require validation&#x27;]:[]),&#x27;# MAGMOM / smearing / dipole treatment: review before submission&#x27;].join(nl);common.POSCAR=[&#x27;# STRUCTURE REQUIRED&#x27;,&#x27;# Upload and validate the reconstructed, H-terminated slab.&#x27;,&#x27;# No coordinates are fabricated by this mockup.&#x27;].join(nl);common.KPOINTS=[&#x27;Gamma mesh&#x27;,&#x27;0&#x27;,&#x27;Gamma&#x27;,state.k,&#x27;0 0 0&#x27;].join(nl);common[&#x27;POTCAR.manifest&#x27;]=[&#x27;status: required-from-local-licensed-library&#x27;,&#x27;species_order: follow-validated-POSCAR&#x27;,&#x27;functional: &#x27;+state.xc,&#x27;checksum: pending&#x27;,&#x27;POTCAR itself is not included.&#x27;].join(nl);}else{common[neb?&#x27;neb.in.draft&#x27;:&#x27;pw.in.draft&#x27;]=[...(neb?[&#x27;# NEB DRAFT: endpoint coordinates and image blocks required&#x27;,&#x27;BEGIN&#x27;,&#x27;BEGIN_PATH_INPUT&#x27;,&#x27;&amp;PATH&#x27;,&quot; string_method=&#x27;neb&#x27;,&quot;,&#x27; num_of_images=7,&#x27;,&#x27; nstep_path=100,&#x27;,&#x27;/&#x27;,&#x27;END_PATH_INPUT&#x27;,&#x27;BEGIN_ENGINE_INPUT&#x27;]:[]),&#x27;! DRAFT ONLY: missing cell, species and coordinates&#x27;,&#x27;&amp;CONTROL&#x27;,` calculation=&#x27;${relax?&#x27;relax&#x27;:&#x27;scf&#x27;}&#x27;,`,` prefix=&#x27;diamond_n&#x27;, pseudo_dir=&#x27;./pseudo&#x27;, outdir=&#x27;./tmp&#x27;,`,` tprnfor=.true., forc_conv_thr=${(force/25.711043).toExponential(6)},`,&#x27;/&#x27;,&#x27;&amp;SYSTEM&#x27;,` ibrav=0, ecutwfc=${state.cutoff}, ecutrho=${state.rho},`,` nspin=${state.spin}, tot_charge=${state.charge},`,` input_dft=&#x27;${state.xc===&#x27;HSE06&#x27;?&#x27;HSE&#x27;:&#x27;PBE&#x27;}&#x27;,`,&#x27; ! nat, ntyp, occupations, magnetization: assign after structure validation&#x27;,&#x27;/&#x27;,&#x27;&amp;ELECTRONS&#x27;,` conv_thr=${state.scf},`,&#x27;/&#x27;,...(relax?[&quot;&amp;IONS&quot;, &quot; ion_dynamics=&#x27;bfgs&#x27;,&quot;,&#x27;/&#x27;]:[]),&#x27;! ATOMIC_SPECIES / CELL_PARAMETERS / ATOMIC_POSITIONS required&#x27;,&#x27;K_POINTS automatic&#x27;,state.k+&#x27; 0 0 0&#x27;,...(neb?[&#x27;END_ENGINE_INPUT&#x27;,&#x27;BEGIN_POSITIONS&#x27;,&#x27;! FIRST_IMAGE / LAST_IMAGE: add validated endpoint coordinates&#x27;,&#x27;END_POSITIONS&#x27;,&#x27;END&#x27;]:[])].join(nl);common[&#x27;UPF.manifest&#x27;]=[&#x27;status: missing&#x27;,&#x27;C: select validated UPF&#x27;,&#x27;H: select validated UPF&#x27;,&#x27;N: select validated UPF&#x27;,&#x27;record functional, source, version, checksum&#x27;].join(nl);}common[state.scheduler===&#x27;PBS&#x27;?&#x27;job.pbs.draft&#x27;:&#x27;job.slurm.draft&#x27;]=[&#x27;#!/bin/bash&#x27;,`#SBATCH --job-name=diamond-n`, `#SBATCH --nodes=${state.nodes}`,`#SBATCH --ntasks=${state.ranks}`,`#SBATCH --time=${state.wall}`,&#x27;set -euo pipefail&#x27;,&#x27;# DRAFT: configure partition, module, executable and scratch path&#x27;,&#x27;# &#x27;+(v?&#x27;srun vasp_std &gt; vasp.log&#x27;:neb?&#x27;srun neb.x -in neb.in &gt; neb.out&#x27;:&#x27;srun pw.x -in pw.in &gt; pw.out&#x27;)].join(nl);if(state.scheduler===&#x27;PBS&#x27;){common[&#x27;job.pbs.draft&#x27;]=[&#x27;#!/bin/bash&#x27;,&#x27;#PBS -N diamond-n&#x27;,`#PBS -l select=${state.nodes}:ncpus=${Math.ceil(state.ranks/state.nodes)}`,`#PBS -l walltime=${state.wall}`,&#x27;set -euo pipefail&#x27;,&#x27;# DRAFT: configure queue, working directory, modules and MPI launch command&#x27;].join(nl);}common[&#x27;run-manifest.json&#x27;]=JSON.stringify({mode:&#x27;draft-not-runnable&#x27;,engine:state.engine,task:state.task,problem:state.problem,source_id:state.selected,xc:state.xc,charge_e:state.charge,structure_status:&#x27;not-validated&#x27;,cutoff:{value:Number(state.cutoff),unit:v?&#x27;eV&#x27;:&#x27;Ry&#x27;},kpoints:state.k,force_eV_A:force,blocking:[&#x27;validated structure&#x27;,&#x27;pseudopotential mapping&#x27;,&#x27;convergence protocol&#x27;,&#x27;cluster profile&#x27;]},null,2);return common;}
