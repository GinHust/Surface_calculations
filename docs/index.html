<style>
/* Shared visual language. Keep the existing navigation and calculation flow. */
#surface-lab-bilingual {
  color-scheme: light;
  --p: #ffffff; --bg: #f4f7fa; --ink: #152b3b; --sub: #607385;
  --line: #e0e8ee; --accent: #087f82; --soft: #eaf7f5;
  --warn: #805b24; --warnbg: #fff7e8;
  font-family: Inter, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px; line-height: 1.65;
  border: 1px solid #dce6ed; border-radius: 18px;
  box-shadow: 0 12px 48px #1737470a;
}
#surface-lab-bilingual .top {
  min-height: 82px; padding: 20px 30px; gap: 18px;
  background: #fff; border-bottom-color: var(--line);
}
#surface-lab-bilingual .brand {
  display: inline-flex; align-items: center; gap: 13px;
  font-size: 17px; font-weight: 750; letter-spacing: 1.2px;
}
#surface-lab-bilingual .brand::before {
  content: ''; display: block; width: 23px; height: 23px;
  border: 2px solid #087f82; border-radius: 5px; transform: rotate(45deg);
  background: linear-gradient(135deg,#e0f4f0 49%,#087f82 50%,#087f82 55%,#f4fbfa 56%);
  box-shadow: 4px -4px 0 #e4f1f0;
}
#surface-lab-bilingual .top>.muted {font-size: 12px; padding-left: 18px; border-left: 1px solid var(--line)}
#surface-lab-bilingual .top>.pill {margin-left: auto; font-size: 11px; letter-spacing: .3px}
#surface-lab-bilingual .shell {grid-template-columns: 218px minmax(0,1fr)}
#surface-lab-bilingual aside {padding: 28px 14px; background: #122b39; color: #c3d3dd}
#surface-lab-bilingual .sidehead {font-size: 10px; letter-spacing: 1.7px; color: #829eae; padding: 0 14px 20px}
#surface-lab-bilingual .nav {
  position: relative; min-height: 48px; gap: 12px; padding: 12px 14px;
  margin: 5px 0; border: 1px solid transparent; border-radius: 9px;
  font-size: 12px; font-weight: 550; line-height: 1.4;
  transition: background .18s ease, color .18s ease, border-color .18s ease;
}
#surface-lab-bilingual .nav svg {width: 17px; height: 17px; stroke-width: 1.6; flex: 0 0 auto; opacity: .85}
#surface-lab-bilingual .nav:hover {background: #ffffff0b; color: #fff}
#surface-lab-bilingual .nav[aria-current=page] {background: #1b444f; border-color: #2d6269; color: #d4ffef; box-shadow: 0 5px 14px #071c2720}
#surface-lab-bilingual .nav[aria-current=page]::before {content:''; position:absolute; left:-15px; top:13px; bottom:13px; width:3px; border-radius:2px; background:#76ddc5}
#surface-lab-bilingual .sidefoot {border-top:1px solid #ffffff15; padding-top:22px; margin:42px 14px 0; font-size:11px; line-height:1.9; color:#9fb7c4}
#surface-lab-bilingual main {padding: 34px; min-height: 820px; background: var(--bg)}
#surface-lab-bilingual .headline {margin-bottom: 26px}
#surface-lab-bilingual .headline>.small {font-size:10px; font-weight:700; letter-spacing:1.8px; color:var(--accent); margin-bottom:8px}
#surface-lab-bilingual h1 {font-size:30px; line-height:1.22; font-weight:720; letter-spacing:-1px; margin:7px 0 11px}
#surface-lab-bilingual .headline>.muted {font-size:13px; max-width:750px; line-height:1.75}
#surface-lab-bilingual h2 {font-size:16px; font-weight:680; letter-spacing:-.2px; margin-bottom:17px}
#surface-lab-bilingual h3 {font-size:13px; font-weight:650; letter-spacing:-.1px}
#surface-lab-bilingual .small {font-size:11px; line-height:1.75}
#surface-lab-bilingual .pill {padding:5px 10px; border:1px solid #d4ebe5; border-radius:20px; font-weight:600; line-height:1.4}
#surface-lab-bilingual .panel {padding:24px; border-radius:14px; border-color:var(--line); box-shadow:0 3px 12px #17374704; margin-bottom:20px}
#surface-lab-bilingual .split {gap:22px; align-items:start; grid-template-columns:minmax(0,1.12fr) minmax(280px,1fr)}
#surface-lab-bilingual .fields {gap:0 18px}
#surface-lab-bilingual label {font-size:11px; font-weight:650; letter-spacing:.1px; color:#53697a; margin-bottom:16px}
#surface-lab-bilingual input,#surface-lab-bilingual select,#surface-lab-bilingual textarea {
  min-height:42px; padding:10px 12px; margin-top:7px;
  border:1px solid #d9e4eb; border-radius:8px; background:#fbfdfe;
  font-size:13px; font-weight:400; color:var(--ink); line-height:1.5;
  transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
#surface-lab-bilingual input::placeholder,#surface-lab-bilingual textarea::placeholder {color:#899ba8}
#surface-lab-bilingual input:focus,#surface-lab-bilingual select:focus,#surface-lab-bilingual textarea:focus {
  outline:none; border-color:#238e91; box-shadow:0 0 0 3px #09818415; background:#fff;
}
#surface-lab-bilingual input[type=checkbox] {min-height:0; width:15px; height:15px; accent-color:var(--accent); margin-top:3px; flex:0 0 auto}
#surface-lab-bilingual input[type=file] {padding:8px; font-size:11px}
#surface-lab-bilingual input::file-selector-button {border:0; background:#eaf3f5; color:#355e6e; padding:7px 9px; border-radius:5px; margin-right:10px; cursor:pointer}
#surface-lab-bilingual button:focus-visible,#surface-lab-bilingual a:focus-visible {outline:3px solid #46b7b2; outline-offset:3px}
#surface-lab-bilingual .button {
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:38px; padding:9px 13px; border-radius:8px;
  font-size:12px; font-weight:600; line-height:1.4;
  border-color:#d7e3e9; background:#fff;
  box-shadow:0 1px 2px #15374606;
  transition:background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
}
#surface-lab-bilingual .button:hover:not(:disabled) {background:#f3f9f9; border-color:#9ccac9; transform:translateY(-1px); box-shadow:0 4px 10px #1537460a}
#surface-lab-bilingual .button svg {width:15px; height:15px; stroke-width:1.8}
#surface-lab-bilingual .primary {background:#087f82; border-color:#087f82; color:#fff; box-shadow:0 4px 12px #087f8220}
#surface-lab-bilingual .primary:hover:not(:disabled) {background:#066c70; border-color:#066c70; color:#fff}
#surface-lab-bilingual a {text-decoration:none; font-weight:550; text-underline-offset:3px}
#surface-lab-bilingual a:hover {text-decoration:underline}
#surface-lab-bilingual .dbitem {
  position:relative; border-radius:11px; padding:17px 18px; margin-bottom:11px;
  border-color:#e0e8ee; box-shadow:0 2px 5px #17374703;
  transition:box-shadow .18s ease, border-color .18s ease, transform .18s ease;
}
#surface-lab-bilingual .dbitem:hover {border-color:#a6caca; box-shadow:0 5px 17px #17374708; transform:translateY(-1px)}
#surface-lab-bilingual .dbitem.selected {background:#f0faf8; border-color:#66b9b0; box-shadow:0 0 0 1px #66b9b010}
#surface-lab-bilingual .dbitem.selected::before {content:''; position:absolute; left:-1px; top:14px; bottom:14px; width:3px; border-radius:3px; background:#159a8e}
#surface-lab-bilingual .dbitem strong {font-size:13px; line-height:1.65; font-weight:650; letter-spacing:-.15px; margin:7px 0}
#surface-lab-bilingual .dbitem>.small:first-child {font-size:10px; font-weight:650; color:#087f82; letter-spacing:.2px}
#surface-lab-bilingual .record {background:#f2f8fa; border-left:3px solid #4faaa4; border-radius:0 8px 8px 0; padding:13px 15px; font-size:13px; line-height:1.85; margin:18px 0}
#surface-lab-bilingual .item {padding:17px 0}
#surface-lab-bilingual .item h3 {margin-bottom:7px}
#surface-lab-bilingual .item p {font-size:12px; line-height:1.8}
#surface-lab-bilingual .notice,#surface-lab-bilingual .banner {border-radius:9px; padding:13px 16px; font-size:12px; line-height:1.8; border:1px solid #f0e3c9}
#surface-lab-bilingual .banner {border-color:#d5ebe5}
#surface-lab-bilingual .flow {gap:8px; color:#a6b7c2; font-size:10px; margin-bottom:25px}
#surface-lab-bilingual .flow button {padding:7px 11px; border-radius:7px; background:transparent; font-size:11px; color:var(--sub); border-color:transparent}
#surface-lab-bilingual .flow button:hover {background:#eaf0f5}
#surface-lab-bilingual .flow button[aria-current=step] {background:#fff; color:#087f82; border-color:#cde4e4; box-shadow:0 2px 6px #17374704}
#surface-lab-bilingual .tablebox {border:1px solid var(--line); border-radius:9px}
#surface-lab-bilingual th {background:#f5f8fa; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase}
#surface-lab-bilingual td,#surface-lab-bilingual th {padding:12px 13px}
#surface-lab-bilingual td {font-size:12px}
#surface-lab-bilingual tbody tr:last-child td {border-bottom:0}
#surface-lab-bilingual tbody tr:hover {background:#f7fbfc}
#surface-lab-bilingual pre {background:#142d3b; color:#d8e9ef; border-radius:10px; padding:19px; font-size:11px; line-height:1.85}
#surface-lab-bilingual .empty {background:#f6f9fb; border:1px dashed #cbdce5; border-radius:10px; padding:30px 18px; font-size:12px}
#surface-lab-bilingual .structure-stage {height:390px; border-radius:12px; border-color:#dbe6ed; background:#f4f8fb}
#surface-lab-bilingual .structure-empty {font-size:13px; color:#6c8492}
#surface-lab-bilingual .structure-empty::before {content:'◇'; font-size:50px; font-weight:200; color:#b7d4d8; margin-right:18px}
#surface-lab-bilingual .check {font-weight:400; line-height:1.7; gap:5px}
#surface-lab-bilingual .statrow b {font-weight:700; letter-spacing:-.7px; font-size:25px}
#surface-lab-bilingual [data-rp-storage] {color:#087f82; font-weight:600}
#surface-lab-bilingual fieldset {border-radius:9px; background:#fbfdfe}
#surface-lab-bilingual #sl-message:empty {display:none}
#surface-lab-bilingual .paper-search-actions {margin-bottom:17px; gap:10px}
#surface-lab-bilingual .inventory-counts {display:flex;align-items:center;gap:27px;padding:0 0 8px}
#surface-lab-bilingual .inventory-counts>div {display:flex;align-items:baseline;gap:8px}
#surface-lab-bilingual .inventory-counts strong {font-size:21px;font-weight:700;line-height:1.3;letter-spacing:-.6px;color:#214958}
#surface-lab-bilingual .inventory-counts span {font-size:10px;color:#6d8290;line-height:1.5;max-width:90px}
#surface-lab-bilingual .source-list {max-height:740px;overflow-y:auto;padding:2px 4px 2px 2px;scrollbar-width:thin;scrollbar-color:#b9d1d8 transparent}
#surface-lab-bilingual [data-action=find-papers],#surface-lab-bilingual [data-action=related-papers] {color:#087f82; border-color:#b7d9d6; background:#f2faf8}
@media(min-width:1350px) {#surface-lab-bilingual main{padding:40px}#surface-lab-bilingual .split{gap:28px}}
@media(max-width:1050px) {#surface-lab-bilingual .shell{grid-template-columns:190px minmax(0,1fr)}#surface-lab-bilingual main{padding:25px}#surface-lab-bilingual h1{font-size:27px}}
@media(max-width:820px) {
  #surface-lab-bilingual{border-radius:12px}
  #surface-lab-bilingual .shell{grid-template-columns:1fr}
  #surface-lab-bilingual .split{grid-template-columns:1fr}
  #surface-lab-bilingual .top{padding:18px 21px;min-height:74px;gap:13px}
  #surface-lab-bilingual .top>.muted{font-size:11px}
  #surface-lab-bilingual aside{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:10px 14px;scrollbar-width:thin}
  #surface-lab-bilingual .nav{width:auto;flex:0 0 auto;white-space:nowrap;margin:0;min-height:40px;padding:10px 12px;font-size:11px}
  #surface-lab-bilingual .nav[aria-current=page]::before{display:none}
  #surface-lab-bilingual .sidehead,#surface-lab-bilingual .sidefoot{display:none}
  #surface-lab-bilingual main{padding:24px;min-height:0}
}
@media(max-width:520px) {
  #surface-lab-bilingual .top{padding:17px;gap:10px}
  #surface-lab-bilingual .brand{font-size:14px;gap:10px}
  #surface-lab-bilingual .brand::before{width:19px;height:19px}
  #surface-lab-bilingual .top>.muted{display:none}
  #surface-lab-bilingual .top>.pill{font-size:9px;padding:5px 8px}
  #surface-lab-bilingual main{padding:23px 16px}
  #surface-lab-bilingual h1{font-size:25px;letter-spacing:-.7px}
  #surface-lab-bilingual .headline>.small{font-size:9px;letter-spacing:1.2px}
  #surface-lab-bilingual .headline>.muted{font-size:12px}
  #surface-lab-bilingual .panel{padding:18px;border-radius:12px}
  #surface-lab-bilingual .fields{grid-template-columns:1fr}
  #surface-lab-bilingual .button{font-size:11px}
  #surface-lab-bilingual .dbitem{padding:15px}
  #surface-lab-bilingual .structure-stage{height:285px}
  #surface-lab-bilingual .structure-empty::before{display:none}
  #surface-lab-bilingual .flow{gap:2px}
  #surface-lab-bilingual .flow button{padding:7px;font-size:10px}
  #surface-lab-bilingual .paper-search-actions>.small{display:none}
  #surface-lab-bilingual .inventory-counts{gap:19px}
  #surface-lab-bilingual .inventory-counts>div{display:block}
  #surface-lab-bilingual .inventory-counts strong,#surface-lab-bilingual .inventory-counts span{display:block}
  #surface-lab-bilingual .inventory-counts span{font-size:9px;margin-top:4px}
  #surface-lab-bilingual .source-list{max-height:470px}
}

/* The standalone search and its embedded view use the same components. */
body.literature-app {color-scheme:light; --ink:#152b3b; --muted:#607385; --bg:#f4f7fa; --edge:#e0e8ee; --accent:#087f82; --soft:#eaf7f5; font-family:Inter,'Segoe UI',system-ui,sans-serif; font-size:14px; line-height:1.7}
body.literature-app header {background:#122b39; padding:19px max(24px,calc((100vw - 1080px)/2)); border-bottom:1px solid #244251}
body.literature-app header a {font-size:12px; font-weight:600; color:#d2e9ea}
body.literature-app main {max-width:1080px; padding:35px 24px 50px}
body.literature-app h1 {font-size:32px; letter-spacing:-1px; font-weight:730; margin-bottom:8px}
body.literature-app h2 {letter-spacing:-.3px}
body.literature-app .panel,body.literature-app .paper {border-radius:14px; border-color:var(--edge); box-shadow:0 3px 15px #15374604; padding:23px}
body.literature-app .paper {margin:14px 0; transition:border-color .18s ease,box-shadow .18s ease}
body.literature-app .paper:hover {border-color:#b7d7d5; box-shadow:0 5px 20px #15374609}
body.literature-app .title {font-size:16px; font-weight:680; letter-spacing:-.25px; line-height:1.65; margin:8px 0}
body.literature-app .meta {font-size:11px; line-height:1.8}
body.literature-app .paper>.meta:first-child {font-weight:600; color:#087f82; letter-spacing:.15px}
body.literature-app input,body.literature-app select {padding:11px 13px; border:1px solid #d9e4eb; border-radius:8px; font-size:13px; background:#fbfdfe; min-height:44px}
body.literature-app label {font-size:11px; color:#53697a; letter-spacing:.2px; font-weight:650}
body.literature-app .filters select,body.literature-app .filters input {display:block;width:100%;margin-top:7px}
body.literature-app input:focus,body.literature-app select:focus {outline:none; border-color:#238e91; box-shadow:0 0 0 3px #09818415; background:#fff}
body.literature-app button,body.literature-app .actions a {font-size:12px; font-weight:600; border-radius:8px; border-color:#d7e3e9; transition:background .16s ease, border-color .16s ease}
body.literature-app button:hover,body.literature-app .actions a:hover {background:#f0f8f7; border-color:#a9cecb; text-decoration:none}
body.literature-app button.primary {background:#087f82; border-color:#087f82; color:#fff; padding:12px 21px; box-shadow:0 4px 12px #087f821a}
body.literature-app button.primary:hover {background:#066c70}
body.literature-app button:focus-visible,body.literature-app a:focus-visible,body.literature-app summary:focus-visible {outline:3px solid #46b7b2; outline-offset:3px}
body.literature-app .quick {gap:7px; padding-top:4px}
body.literature-app .quick button {font-size:11px; padding:6px 10px; color:#536d79; background:#f6f9fa}
body.literature-app .actions {gap:8px; margin-top:14px}
body.literature-app .actions a,body.literature-app .actions button {font-size:11px; padding:7px 10px; min-height:32px}
body.literature-app .actions button[data-bookmark] {margin-left:auto; color:#087f82; border-color:#bcdbd5; background:#f0f9f6}
body.literature-app .tabs {gap:5px; padding:5px; background:#eaf0f4; border:1px solid #e0e8ee; border-radius:11px; margin-top:20px}
body.literature-app .tabs button {border-color:transparent; background:transparent; color:#617785; padding:9px 15px; font-size:12px}
body.literature-app .tabs button.active {background:#fff; color:#087f82; box-shadow:0 2px 5px #15374609; border-color:#e0e8ee}
body.literature-app #count {margin-left:auto; padding:0 10px; font-variant-numeric:tabular-nums}
body.literature-app #status {font-size:12px; margin:14px 2px 5px; color:#607385}
body.literature-app .abstract {font-size:12px; line-height:1.85; background:#f5f9fb; border-radius:8px; padding:14px}
body.literature-app details summary {font-size:12px; color:#4d6f7b; cursor:pointer}
body.literature-app footer {padding:18px 0; font-size:11px; line-height:1.8; border-top:1px solid var(--edge); color:#748794}
body.literature-app.embedded main {padding-top:4px}
@media(max-width:620px) {
  body.literature-app main{padding:22px 15px 35px}
  body.literature-app .panel,body.literature-app .paper{padding:18px;border-radius:11px}
  body.literature-app h1{font-size:27px}
  body.literature-app .title{font-size:14px}
  body.literature-app .controls{grid-template-columns:1fr}
  body.literature-app .tabs button{padding:8px 10px;font-size:11px}
  body.literature-app #count{font-size:10px;padding:0 3px}
  body.literature-app .actions button[data-bookmark]{margin-left:0}
}
@media(prefers-reduced-motion:reduce) {
  #surface-lab-bilingual *,body.literature-app * {transition:none!important;scroll-behavior:auto!important}
  #surface-lab-bilingual .button:hover,#surface-lab-bilingual .dbitem:hover {transform:none}
}

/* Shell and paper-search dialog. Scoped to avoid changing iframe contents. */
html[data-visualize-standalone]:has(>body.surface-host) {color-scheme:light; background:#edf2f6}
html[data-visualize-standalone]>body.surface-host {padding:20px; background:#edf2f6; max-width:1640px; margin:0 auto}
#surface-utility-bar {display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0 5px 15px; font:11px/1.5 'Segoe UI',system-ui,sans-serif; color:#6a8290; letter-spacing:.2px}
#surface-utility-bar a {color:#087f82; text-decoration:none; font-weight:650; padding:5px 0}
#surface-utility-bar a:hover {text-decoration:underline}
#paper-search-dialog {width:min(1140px,95vw); height:92vh; max-height:92vh; border:1px solid #d9e5ec; border-radius:17px; background:#f4f7fa; box-shadow:0 30px 100px #0a23354a; padding:0}
#paper-search-dialog::backdrop {background:#0c263a9c; backdrop-filter:blur(5px)}
#paper-search-dialog .paper-dialog-header {min-height:72px; padding:17px 24px; font-family:Inter,'Segoe UI',system-ui,sans-serif; border-bottom-color:#e0e8ee}
#paper-search-dialog h2 {font-size:17px; font-weight:700; letter-spacing:-.4px; color:#152b3b}
#paper-search-dialog .paper-dialog-actions {gap:18px}
#paper-search-dialog a {font-size:11px; font-weight:600; color:#087f82}
#paper-search-dialog button {border-color:#d7e3e9; padding:8px 13px; border-radius:8px; font-size:12px; font-weight:600}
#paper-search-dialog button:hover {background:#eef7f5; border-color:#a6ccca}
#paper-search-dialog button:focus-visible {outline:3px solid #46b7b2; outline-offset:3px}
#paper-search-dialog iframe {height:calc(100% - 73px); background:#f4f7fa}
@media(max-width:620px) {
  html[data-visualize-standalone]>body.surface-host{padding:8px}
  #surface-utility-bar{padding:2px 5px 10px;font-size:10px}
  #surface-utility-bar>span{font-size:9px;letter-spacing:.1px}
  #paper-search-dialog{width:calc(100vw - 16px);max-width:calc(100vw - 16px);border-radius:12px;height:94vh;max-height:94vh}
  #paper-search-dialog .paper-dialog-header{padding:13px;min-height:63px;gap:7px}
  #paper-search-dialog h2{font-size:14px}
  #paper-search-dialog .paper-dialog-actions{gap:9px}

      {

        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },

    );

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

    }

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

    }

/* Shared visual language. Keep the existing navigation and calculation flow. */
#surface-lab-bilingual {
  color-scheme: light;
  --p: #ffffff; --bg: #f4f7fa; --ink: #152b3b; --sub: #607385;
  --line: #e0e8ee; --accent: #087f82; --soft: #eaf7f5;
  --warn: #805b24; --warnbg: #fff7e8;
  font-family: Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif;
  font-size: 14px; line-height: 1.65;
  border: 1px solid #dce6ed; border-radius: 18px;
  box-shadow: 0 12px 48px #1737470a;
}
#surface-lab-bilingual .top {
  min-height: 82px; padding: 20px 30px; gap: 18px;
  background: #fff; border-bottom-color: var(--line);
}
#surface-lab-bilingual .brand {
  display: inline-flex; align-items: center; gap: 13px;
  font-size: 17px; font-weight: 750; letter-spacing: 1.2px;
}
#surface-lab-bilingual .brand::before {
  content: &#x27;&#x27;; display: block; width: 23px; height: 23px;
  border: 2px solid #087f82; border-radius: 5px; transform: rotate(45deg);
  background: linear-gradient(135deg,#e0f4f0 49%,#087f82 50%,#087f82 55%,#f4fbfa 56%);
  box-shadow: 4px -4px 0 #e4f1f0;
}
#surface-lab-bilingual .top&gt;.muted {font-size: 12px; padding-left: 18px; border-left: 1px solid var(--line)}
#surface-lab-bilingual .top&gt;.pill {margin-left: auto; font-size: 11px; letter-spacing: .3px}
#surface-lab-bilingual .shell {grid-template-columns: 218px minmax(0,1fr)}
#surface-lab-bilingual aside {padding: 28px 14px; background: #122b39; color: #c3d3dd}
#surface-lab-bilingual .sidehead {font-size: 10px; letter-spacing: 1.7px; color: #829eae; padding: 0 14px 20px}
#surface-lab-bilingual .nav {
  position: relative; min-height: 48px; gap: 12px; padding: 12px 14px;
  margin: 5px 0; border: 1px solid transparent; border-radius: 9px;
  font-size: 12px; font-weight: 550; line-height: 1.4;
  transition: background .18s ease, color .18s ease, border-color .18s ease;
}
#surface-lab-bilingual .nav svg {width: 17px; height: 17px; stroke-width: 1.6; flex: 0 0 auto; opacity: .85}
#surface-lab-bilingual .nav:hover {background: #ffffff0b; color: #fff}
#surface-lab-bilingual .nav[aria-current=page] {background: #1b444f; border-color: #2d6269; color: #d4ffef; box-shadow: 0 5px 14px #071c2720}
#surface-lab-bilingual .nav[aria-current=page]::before {content:&#x27;&#x27;; position:absolute; left:-15px; top:13px; bottom:13px; width:3px; border-radius:2px; background:#76ddc5}
#surface-lab-bilingual .sidefoot {border-top:1px solid #ffffff15; padding-top:22px; margin:42px 14px 0; font-size:11px; line-height:1.9; color:#9fb7c4}
#surface-lab-bilingual main {padding: 34px; min-height: 820px; background: var(--bg)}
#surface-lab-bilingual .headline {margin-bottom: 26px}
#surface-lab-bilingual .headline&gt;.small {font-size:10px; font-weight:700; letter-spacing:1.8px; color:var(--accent); margin-bottom:8px}
#surface-lab-bilingual h1 {font-size:30px; line-height:1.22; font-weight:720; letter-spacing:-1px; margin:7px 0 11px}

(function (scope) {
  &#x27;use strict&#x27;;
  const LIBRARY_URL = &#x27;https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js&#x27;;
  const MAX_ATOMS = 10000;
  const MAX_BYTES = 5 * 1024 * 1024;
  const elements = new Set((&#x27;H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og&#x27;).split(&#x27; &#x27;));
  const fail = key =&gt; { throw new Error(key); };
  const tokens = line =&gt; (line || &#x27;&#x27;).trim().split(/\s+/);
  const number = value =&gt; Number(String(value).replace(/[dD]/g, &#x27;e&#x27;));
  function triple(line) {
    const values = tokens(line).slice(0, 3).map(number);
    if (values.length !== 3 || values.some(v =&gt; !Number.isFinite(v))) fail(&#x27;invalid&#x27;);

    const [a, b, c] = m;
    return a[0] * (b[1] * c[2] - b[2] * c[1]) - a[1] * (b[0] * c[2] - b[2] * c[0]) + a[2] * (b[0] * c[1] - b[1] * c[0]);

function translateText(text){

  let out=text;

  const placeholders=[];
  for(const [ko,en] of translationPairs){
    if(out.includes(ko)){const key=&#x27;\uE000&#x27;+placeholders.length+&#x27;\uE001&#x27;;placeholders.push(en);out=out.split(ko).join(key);}

    if(!originalText.has(node))originalText.set(node,node.nodeValue);
    node.nodeValue=translateText(originalText.get(node));

  root.querySelectorAll(&#x27;[placeholder],[aria-label]&#x27;).forEach(el=&gt;{
    if(el.closest(&#x27;.language-switch&#x27;)||el===root)return;
    for(const attr of [&#x27;placeholder&#x27;,&#x27;aria-label&#x27;]){
      if(!el.hasAttribute(attr))continue;
      const marker=&#x27;data-original-&#x27;+attr;
      if(!el.hasAttribute(marker))el.setAttribute(marker,el.getAttribute(attr));
      el.setAttribute(attr,translateText(el.getAttribute(marker)));

  });
  const problemInput=root.querySelector(&#x27;input[data-key=&quot;problem&quot;]&#x27;);

      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
<style>

#paper-search-dialog::backdrop{background:rgba(10,30,40,.55)}
#paper-search-dialog .paper-dialog-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 18px;border-bottom:1px solid #d8e4e9;background:#fff;font:14px system-ui}

#paper-search-dialog a{color:#087c83}#paper-search-dialog button{font:inherit;padding:7px 12px;border:1px solid #b8ced6;border-radius:6px;background:#fff;color:#163746;cursor:pointer}
#paper-search-dialog iframe{display:block;width:100%;height:calc(100% - 61px);margin:0;border:0}

</style>
<dialog id="paper-search-dialog" aria-labelledby="paper-search-heading">
  <div class="paper-dialog-header"><h2 id="paper-search-heading">Find research papers</h2><div class="paper-dialog-actions"><a id="paper-search-full" href="./literature-search.html" target="_blank" rel="noopener noreferrer">Open full page ↗</a><button id="paper-search-close" type="button" aria-label="Close paper search">Close</button></div></div>
  <iframe id="paper-search-frame" title="Research paper search" referrerpolicy="no-referrer"></iframe>
</dialog>
<script>
/* Keep online search outside the sandboxed calculation app. */
(function () {
  'use strict';
  const app=document.getElementById('codex-visualization');
  const dialog=document.getElementById('paper-search-dialog');
  const searchFrame=document.getElementById('paper-search-frame');
  const fullPage=document.getElementById('paper-search-full');
  let lastQuery=null,previousFocus=null;
  function open(query) {
    query=(typeof query==='string'?query:'').trim().slice(0,300)||'nitrogen incorporation diamond';
    const url=new URL('./literature-search.html',window.location.href);
    url.searchParams.set('q',query);
    fullPage.href=url.href;
    url.searchParams.set('embedded','1');
    if(lastQuery!==query){searchFrame.src=url.href;lastQuery=query;}
    if(!dialog.open){previousFocus=document.activeElement;dialog.showModal();}
  }
  document.getElementById('paper-search-close').addEventListener('click',()=>dialog.close());
  dialog.addEventListener('close',()=>previousFocus?.focus());
  window.addEventListener('message',event=>{
    if(event.source!==app.contentWindow||event.data?.type!=='surface-paper-search')return;
    open(event.data.query);
  });
})();

</script>
