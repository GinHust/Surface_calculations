const translationPairs=Object.entries(translations).sort((a,b)=>b[0].length-a[0].length);
const originalText=new WeakMap();
function translateText(text){
  if(state.locale!=='en')return text;
  let out=text;
  // Replace each source phrase once without retranslating inserted English.
  const placeholders=[];
  for(const [ko,en] of translationPairs){
    if(out.includes(ko)){const key='\uE000'+placeholders.length+'\uE001';placeholders.push(en);out=out.split(ko).join(key);}
  }
  return out.replace(/\uE000(\d+)\uE001/g,(_,i)=>placeholders[Number(i)]);
}
function localize(){
  root.setAttribute('lang',state.locale);
  root.setAttribute('aria-label',state.locale==='en'?'Surface Compute Lab data and computation interface':'Surface Compute Lab 데이터·계산 인터페이스');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let node;
  while((node=walker.nextNode())){
    if(node.parentElement.closest('style,script,pre,code,.language-switch,[data-user-content]'))continue;
    if(!originalText.has(node))originalText.set(node,node.nodeValue);
    node.nodeValue=translateText(originalText.get(node));
  }
  root.querySelectorAll('[placeholder],[aria-label]').forEach(el=>{
    if(el.closest('.language-switch')||el===root)return;
    for(const attr of ['placeholder','aria-label']){
      if(!el.hasAttribute(attr))continue;
      const marker='data-original-'+attr;
      if(!el.hasAttribute(marker))el.setAttribute(marker,el.getAttribute(attr));
      el.setAttribute(attr,translateText(el.getAttribute(marker)));
    }
  });
  const problemInput=root.querySelector('input[data-key="problem"]');
  if(problemInput&&state.problem===defaultProblem)problemInput.value=translateText(defaultProblem);
  root.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.locale)));
}

function makeFiles(){const v=state.engine==='VASP',relax=state.task==='relax',neb=state.task==='neb',force=Number(state.force),common={};if(v){common.INCAR=['# DRAFT ONLY: structure and POTCAR not yet registered',`SYSTEM = Diamond_N_surface_${state.task}`,`ENCUT = ${state.cutoff}`,`EDIFF = ${state.scf}`,`EDIFFG = -${force}`,`ISPIN = ${state.spin}`,'# NELECT: derive from POTCAR valence sum and requested charge',`# requested charge = ${state.charge} e`,`GGA = PE`,...(state.xc==='HSE06'?['LHFCALC = .TRUE.','HFSCREEN = 0.2','AEXX = 0.25']:[]),`IBRION = ${neb?3:relax?2:-1}`,`NSW = ${relax||neb?200:0}`,'ISIF = 2',...(neb?['IMAGES = 5','SPRING = -5','POTIM = 0','# NEB optimizer and image folders require validation']:[]),'# MAGMOM / smearing / dipole treatment: review before submission'].join(nl);common.POSCAR=['# STRUCTURE REQUIRED','# Upload and validate the reconstructed, H-terminated slab.','# No coordinates are fabricated by this mockup.'].join(nl);common.KPOINTS=['Gamma mesh','0','Gamma',state.k,'0 0 0'].join(nl);common['POTCAR.manifest']=['status: required-from-local-licensed-library','species_order: follow-validated-POSCAR','functional: '+state.xc,'checksum: pending','POTCAR itself is not included.'].join(nl);}else{common[neb?'neb.in.draft':'pw.in.draft']=[...(neb?['# NEB DRAFT: endpoint coordinates and image blocks required','BEGIN','BEGIN_PATH_INPUT','&PATH'," string_method='neb',",' num_of_images=7,',' nstep_path=100,','/','END_PATH_INPUT','BEGIN_ENGINE_INPUT']:[]),'! DRAFT ONLY: missing cell, species and coordinates','&CONTROL',` calculation='${relax?'relax':'scf'}',`,` prefix='diamond_n', pseudo_dir='./pseudo', outdir='./tmp',`,` tprnfor=.true., forc_conv_thr=${(force/25.711043).toExponential(6)},`,'/','&SYSTEM',` ibrav=0, ecutwfc=${state.cutoff}, ecutrho=${state.rho},`,` nspin=${state.spin}, tot_charge=${state.charge},`,` input_dft='${state.xc==='HSE06'?'HSE':'PBE'}',`,' ! nat, ntyp, occupations, magnetization: assign after structure validation','/','&ELECTRONS',` conv_thr=${state.scf},`,'/',...(relax?["&IONS", " ion_dynamics='bfgs',",'/']:[]),'! ATOMIC_SPECIES / CELL_PARAMETERS / ATOMIC_POSITIONS required','K_POINTS automatic',state.k+' 0 0 0',...(neb?['END_ENGINE_INPUT','BEGIN_POSITIONS','! FIRST_IMAGE / LAST_IMAGE: add validated endpoint coordinates','END_POSITIONS','END']:[])].join(nl);common['UPF.manifest']=['status: missing','C: select validated UPF','H: select validated UPF','N: select validated UPF','record functional, source, version, checksum'].join(nl);}common[state.scheduler==='PBS'?'job.pbs.draft':'job.slurm.draft']=['#!/bin/bash',`#SBATCH --job-name=diamond-n`, `#SBATCH --nodes=${state.nodes}`,`#SBATCH --ntasks=${state.ranks}`,`#SBATCH --time=${state.wall}`,'set -euo pipefail','# DRAFT: configure partition, module, executable and scratch path','# '+(v?'srun vasp_std > vasp.log':neb?'srun neb.x -in neb.in > neb.out':'srun pw.x -in pw.in > pw.out')].join(nl);if(state.scheduler==='PBS'){common['job.pbs.draft']=['#!/bin/bash','#PBS -N diamond-n',`#PBS -l select=${state.nodes}:ncpus=${Math.ceil(state.ranks/state.nodes)}`,`#PBS -l walltime=${state.wall}`,'set -euo pipefail','# DRAFT: configure queue, working directory, modules and MPI launch command'].join(nl);}common['run-manifest.json']=JSON.stringify({mode:'draft-not-runnable',engine:state.engine,task:state.task,problem:state.problem,source_id:state.selected,xc:state.xc,charge_e:state.charge,structure_status:'not-validated',cutoff:{value:Number(state.cutoff),unit:v?'eV':'Ry'},kpoints:state.k,force_eV_A:force,blocking:['validated structure','pseudopotential mapping','convergence protocol','cluster profile']},null,2);return common;}
function inputs(){if(state.generated)files=makeFiles();const names=Object.keys(files),file=names.includes(state.file)?state.file:names[0];return heading('INPUT BUILDER','VASP · Quantum ESPRESSO 입력 파일','설정값을 반영한 입력 초안과 실행 스크립트를 미리 봅니다.')+flow()+`<div class="row between" style="margin-bottom:14px"><span class="pill">${state.engine} · ${state.xc} · ${state.task}</span><button class="button primary" data-action="generate">입력 초안 생성 / 갱신</button></div><div class="notice">구조·pseudopotential·수렴 검증이 없어 실행 가능한 최종 입력이 아닙니다. POTCAR/UPF는 실제 라이브러리 연결 후 준비합니다.</div><div class="split"><section class="panel"><h2>입력 파일 미리보기</h2>${state.generated?`<div class="tabs">${names.map(n=>`<button class="button" data-file="${n}" aria-pressed="${n===file}">${n}</button>`).join('')}</div><pre>${esc(files[file])}</pre><button class="button" data-action="download-input">선택 파일 내려받기</button>`:'<div class="empty">위의 입력 초안 생성 버튼을 눌러보세요.</div>'}</section><section class="panel"><h2>실행 전 검사</h2><div class="item">✓ 문제 정의·계산 조건 기록</div><div class="item">○ 원자 구조·셀·고정 원자 검증</div><div class="item">○ POTCAR / UPF·함수 일치</div><div class="item">○ cutoff·k-grid·slab 수렴</div><div class="item">○ Spin·전하·dipole 조건</div><div class="item">○ Cluster 실행 환경·자원 매핑</div><div class="item"><p class="small">VASP eV ↔ QE Ry, force eV/Å ↔ Ry/Bohr 단위를 구분합니다. 엔진 전환은 동일 정확도를 보장하지 않습니다.</p></div>${go('define','조건 수정')}${go('cluster','Cluster 실행 시연 →')}</section></div>`;}
function cluster(){const stages=['패키지 준비','업로드','대기열','실행','결과 회수'];return heading('CLUSTER RUNNER','업로드 · 제출 · 모니터링','서버 연결 프로필과 계산 패키지를 이용해 작업을 실행하는 흐름입니다.')+flow()+`<div class="banner">시연 전용 · SSH 접속, 파일 전송, 작업 제출은 발생하지 않습니다.</div><div class="split"><section class="panel"><h2>서버 · 실행 조건</h2><label>Cluster 프로필<select><option>그룹 Cluster · 연결 설정 필요</option></select></label><div class="fields">${select('scheduler','스케줄러',['Slurm','PBS'])}${input('nodes','Nodes','number','min="1"')}${input('ranks','전체 MPI ranks','number','min="1"')}${input('wall','Walltime (HH:MM:SS)')}</div><label>원격 작업 경로<input value="/scratch/&lt;user&gt;/diamond/&lt;run-id&gt;" readonly></label><p class="small">실제 연결 시: 서버 주소·계정·인증 참조·partition/queue·모듈·실행 파일·보관 경로 설정</p><div class="row" style="margin-top:15px"><button class="button primary" data-action="advance" ${state.generated?'':'disabled'}>${state.stage===0?'업로드 시연 시작':state.stage<5?'다음 실행 단계 시연':'새 시연 시작'}</button><button class="button" data-action="cancel" ${state.stage>0&&state.stage<5?'':'disabled'}>시연 작업 취소</button></div>${!state.generated?'<p class="small">입력 파일 화면에서 먼저 초안을 생성해 주세요.</p>':''}</section><section class="panel"><h2>작업 상태 · DEMO-RUN-001</h2><div class="state">${stages.map((x,i)=>`<div class="${state.stage>i?'done':''}">${state.stage>i?'✓ ':''}${x}</div>`).join('')}</div><pre>${esc(state.stage===0?'No remote connection.':[`[SIMULATION ONLY] ${state.engine} / ${state.scheduler}`,state.stage>=1?'Draft package prepared; unresolved inputs bypassed for UI demo.':'',state.stage>=2?'Mock upload acknowledged.':'',state.stage>=3?'Mock scheduler ID: DEMO-001; queued.':'',state.stage>=4?'Mock run started. No solver invoked.':'',state.stage>=5?'Synthetic fixture loaded. Not a scientific result.':''].filter(Boolean).join(nl))}</pre><p class="small">실제 구현에서는 서버 job ID, 상태·로그, 전송 확인, 종료 코드, 결과 파일 검증을 기록합니다.</p>${state.stage>=5?go('results','시연 결과 확인 →',true):''}</section></div>`;}
function plot(type){const vals=type==='energy'?[0,.22,.65,.96,.78,.31,.12]:[.24,.12,.067,.033,.018,.009,.004],n=vals.length,w=500,h=230,left=60,right=20,top=20,bottom=42,max=type==='energy'?1.2:.3;const points=vals.map((v,i)=>`${left+i*(w-left-right)/(n-1)},${h-bottom-v/max*(h-top-bottom)}`).join(' ');return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${type==='energy'?'가상 NEB 에너지 프로파일':'가상 힘 수렴 이력'} · 실제 계산 아님"><line x1="${left}" y1="${top}" x2="${left}" y2="${h-bottom}" stroke="var(--line)"/><line x1="${left}" y1="${h-bottom}" x2="${w-right}" y2="${h-bottom}" stroke="var(--line)"/>${[0,.5,1].map(t=>`<line x1="${left}" x2="${w-right}" y1="${h-bottom-t*(h-top-bottom)}" y2="${h-bottom-t*(h-top-bottom)}" stroke="var(--line)"/><text x="50" y="${h-bottom-t*(h-top-bottom)+4}" text-anchor="end">${(t*max).toFixed(2)}</text>`).join('')}<polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${vals.map((v,i)=>`<circle cx="${left+i*(w-left-right)/(n-1)}" cy="${h-bottom-v/max*(h-top-bottom)}" r="4" fill="var(--accent)"/><text x="${left+i*(w-left-right)/(n-1)}" y="207" text-anchor="middle">${i}</text>`).join('')}<text x="${left}" y="14">${type==='energy'?'Relative energy (eV)':'Max force (eV/Å)'}</text><text x="280" y="227" text-anchor="middle">${type==='energy'?'NEB image':'Ionic step'}</text></svg>`;}
function results(){return heading('RESULT EXPLORER','해석 결과 · 데이터 축적','입력 조건과 원본 출력, 수렴 상태, 구조·에너지 결과를 함께 조회합니다.')+flow()+(!state.result?`<section class="panel"><div class="empty">회수된 실제 계산 결과가 없습니다.</div><div class="row" style="margin-top:15px"><button class="button primary" data-action="fixture">표시용 샘플 결과 열기</button>${go('cluster','실행 흐름 보기')}</div></section>`:`<div class="notice">전체 수치는 화면 검토용 합성 데이터입니다. 문헌값이나 VASP / QE 계산 결과가 아닙니다.</div><div class="row between" style="margin-bottom:15px"><span class="pill">DEMO-RESULT · 반응 경로 예시</span><button class="button" data-action="archive">DB 저장 동작 시연</button></div><div class="split"><section class="panel"><h2>반응 경로 · 합성 데이터</h2>${plot('energy')}<div class="statrow"><div><span class="small">ΔE‡ · 예시</span><b>0.96 eV</b></div><div><span class="small">ΔE reaction · 예시</span><b>+0.12 eV</b></div></div><p class="small">0 K 전자에너지 예시 · 진동·ZPE·유한온도 보정 미포함</p></section><section class="panel"><h2>구조 최적화 · 합성 데이터</h2>${plot('force')}<div class="row"><span class="pill">힘 이력 예시</span><span class="pill warning">TS 검증 미수행</span></div></section></div><section class="panel"><h2>원본 결과·검증 이력</h2><div class="tablebox"><table><thead><tr><th>항목</th><th>VASP 연결 시</th><th>QE 연결 시</th><th>현재</th></tr></thead><tbody><tr><td>에너지·힘·SCF</td><td>OUTCAR / vasprun.xml / OSZICAR</td><td>pw.out / XML</td><td>파서 연결 예정</td></tr><tr><td>최종 구조</td><td>CONTCAR</td><td>최종 cell·positions / XML</td><td>구조 뷰어 연결 예정</td></tr><tr><td>NEB·전이상태</td><td>image별 출력·추가 진동 분석</td><td>neb.out·image 출력·추가 분석</td><td>샘플 프로파일만 표시</td></tr></tbody></table></div><div class="row" style="margin-top:15px">${go('post','후처리 모듈로 전달 →',true)}</div></section>`);}
function post(){const valid=Number.isFinite(Number(state.temp))&&Number(state.temp)>0&&Number.isFinite(Number(state.dg)),rate=valid?2.083661912e10*Number(state.temp)*Math.exp(-Number(state.dg)/(8.617333262e-5*Number(state.temp))):NaN;return heading('POSTPROCESSING','Kinetics · COMSOL 전달','문헌값 또는 계산 결과를 선택해 보정·속도상수·반응 경계조건으로 변환합니다.')+flow()+`<div class="split"><section class="panel"><h2>데이터 선택과 해석</h2>${select('source','입력 데이터 출처',[['demo','합성 ΔG‡ 예제 · 시연'],['dft','DFT 전자에너지 결과'],['literature','문헌 DB · 정량값 미등록']])}${state.source==='demo'?`<div class="notice">ΔG‡는 사용자가 조정하는 예시값입니다. 결과 화면의 ΔE‡와 다른 값이며 자동 변환된 결과가 아닙니다.</div><div class="fields">${input('dg','예시 ΔG‡ (eV)','number','step="0.05"')}${input('temp','평가 온도 (K)','number','min="1"')}</div><div class="record"><span class="small">단일 표면 elementary event · κ = 1</span><h3>k(T) = (kBT / h) exp[−ΔG‡(T) / kBT]</h3><div class="statrow"><div><span class="small">시연 속도상수</span><b>${valid?rate.toExponential(3)+' s⁻¹':'조건을 확인하세요'}</b></div></div></div>`:state.source==='dft'?'<div class="notice">전자에너지 ΔE‡를 ΔG‡로 직접 사용하지 않습니다. ZPE·진동·온도·엔트로피 보정과 전이상태 검증을 먼저 연결해야 합니다.</div>':'<div class="notice">문헌 반응 장벽이 미등록 상태입니다. 원문 위치·단위·표면 상태를 확인한 뒤 사용합니다.</div>'}<button class="button primary" data-action="post" ${state.source!=='demo'||!valid?'disabled':''}>예시 후처리 패키지 생성</button></section><section class="panel"><h2>전달 전 필수 항목</h2><div class="item">① 데이터 계보: 문헌 ID / 계산 run ID</div><div class="item">② ΔE‡ ↔ ΔG‡ 구분·보정·유효 온도</div><div class="item">③ 반응식·site 수지·정/역반응 일관성</div><div class="item">④ 표면 피복률·site density·흡착 플럭스</div><div class="item">⑤ 종별 순속도·탄소 편입률·단위</div><p class="small">단일 event의 s⁻¹를 COMSOL의 mol/(m²·s) 경계 플럭스로 바로 넘기지 않습니다.</p></section></div><section class="panel"><h2>COMSOL Needs · 연결 명세 초안</h2><div class="tablebox"><table><thead><tr><th>필요 항목</th><th>공급원</th><th>전달 형식·단위</th><th>상태</th></tr></thead><tbody><tr><td>표면 반응속도상수 kᵢ(T)</td><td>문헌 / DFT+보정</td><td>JSON·CSV / 반응 차수별 단위</td><td>예제만 생성 가능</td></tr><tr><td>순표면반응속도 rᵢ</td><td>Microkinetics</td><td>식·table / mol·m⁻²·s⁻¹</td><td>site·피복률 모델 필요</td></tr><tr><td>Tₛ·기상종 농도 또는 플럭스</td><td>COMSOL → 표면 모델</td><td>K / mol·m⁻³ 또는 mol·m⁻²·s⁻¹</td><td>모델 변수 매핑 필요</td></tr><tr><td>성장속도 G(r)</td><td>탄소 순편입+밀도</td><td>m·s⁻¹ → μm·h⁻¹</td><td>성장·수지 검증 필요</td></tr></tbody></table></div>${state.post&&state.source==='demo'?`<div class="banner" style="margin-top:15px">예시 패키지 준비됨 · 실제 COMSOL 모델 연결 전</div><div class="row"><button class="button" data-action="export-post">Kinetics JSON 내려받기</button><button class="button" data-action="export-csv">k(T) CSV 내려받기</button></div>`:''}</section>`;}
function render(){const f={db,define,inputs,cluster,results,post};if(!f[state.page])state.page='db';view.innerHTML=f[state.page]();localize();root.querySelectorAll('.nav').forEach(x=>x.setAttribute('aria-current',x.dataset.go===state.page?'page':'false'));message.textContent='';if(globalThis.lucide)lucide.createIcons();}
function download(name,data,type='text/plain'){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);message.textContent=name+' '+translateText('생성됨 · 브라우저 다운로드 지원 여부에 따라 저장됩니다.');}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.lang){state.locale=b.dataset.lang;render();save();return;}if(b.dataset.go){state.page=b.dataset.go;render();save();return;}if(b.dataset.source){state.selected=b.dataset.source;render();save();return;}if(b.dataset.file){state.file=b.dataset.file;render();return;}switch(b.dataset.action){case 'use-source':state.page='define';render();save();break;case 'generate':files=makeFiles();state.generated=true;state.file=Object.keys(files)[0];render();save();break;case 'download-input':{const name=Object.hasOwn(files,state.file)?state.file:Object.keys(files)[0];download(name,files[name]);break;}case 'advance':state.stage=state.stage>=5?1:state.stage+1;if(state.stage===5)state.result=true;render();save();break;case 'cancel':state.stage=0;render();message.textContent=translateText('시연 작업을 취소했습니다. 실제 서버 작업은 없습니다.');save();break;case 'fixture':state.result=true;render();save();break;case 'archive':message.textContent=translateText('목업 저장 시연: 합성 데이터 표식을 유지합니다. 실제 DB에 기록하지 않습니다.');break;case 'exportdb':download('surface-literature-seed.json',JSON.stringify({date:'2026-11-03',scope:'diamond nitrogen surface effect',quantitative_barriers_verified:false,language:state.locale,sources:state.locale==='en'?JSON.parse(translateText(JSON.stringify(sources))):sources,reaction_candidates:reactions.map(r=>({id:r[0],name:r[1],purpose:translateText(r[2]),sources:r[3],required:translateText(r[4]),barrier_eV:null}))},null,2),'application/json');break;case 'post':state.post=true;render();save();break;case 'export-post':download('kinetics-demo.json',JSON.stringify({status:'synthetic-example-not-validated',source:'user-adjustable-demo',method:'TST',kappa:1,deltaG_barrier_eV:Number(state.dg),temperature_K:Number(state.temp),rate_unit:'s^-1',comsol_ready:false,missing:['temperature-dependent free energy','site density','coverage model','reaction stoichiometry and surface flux mapping']},null,2),'application/json');break;case 'export-csv':{const ts=[900,1000,1100,1200,1300];download('kinetics-demo.csv','status,T_K,assumed_deltaG_eV,k_per_s'+nl+ts.map(t=>`synthetic_constant_deltaG_example,${t},${state.dg},${(2.083661912e10*t*Math.exp(-Number(state.dg)/(8.617333262e-5*t))).toExponential(8)}`).join(nl),'text/csv');break;}}});
root.addEventListener('change',e=>{if(e.target.id==='sl-structure'){if(e.target.files[0])state.structure=e.target.files[0].name+' · 검증 전';render();save();return;}const key=e.target.dataset.key;if(!key)return;const numeric=['cutoff','rho','force','charge','vacuum','layers','base','nodes','ranks','temp','dg'];state[key]=numeric.includes(key)?Number(e.target.value):e.target.value;if(key==='engine'){state.cutoff=state.engine==='VASP'?500:60;state.scf=state.engine==='VASP'?'1e-6':'1e-8';state.file='';}if(!['source','temp','dg','filter'].includes(key)){state.stage=0;state.generated=false;files={};}if(['source','temp','dg'].includes(key))state.post=false;render();save();});
root.addEventListener('input',e=>{if(e.target.id==='sl-search'){state.query=e.target.value;const pos=e.target.selectionStart;render();const el=root.querySelector('#sl-search');el.focus();el.setSelectionRange(pos,pos);}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){applySaved(e.detail.globals.widgetState);render();}});
render();
})();
