const translationPairs=Object.entries(translations).sort((a,b)=>b[0].length-a[0].length);
const originalText=new WeakMap();
function translateText(text){

  let out=text;
  // Replace each source phrase once without retranslating inserted English.
  const placeholders=[];
  for(const [ko,en] of translationPairs){
    if(out.includes(ko)){const key='\uE000'+placeholders.length+'\uE001';placeholders.push(en);out=out.split(ko).join(key);}
  }
  return out.replace(/\uE000(\d+)\uE001/g,(_,i)=>placeholders[Number(i)]);
}
function localize(){
  root.setAttribute('lang',state.locale);
  root.setAttribute('aria-label',state.locale==='en'?'Surface Compute Lab data and computation interface':'Surface Compute Lab 데이터·계산 인터페이스');
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let node;
  while((node=walker.nextNode())){
    if(node.parentElement.closest('style,script,pre,code,.language-switch,[data-user-content]'))continue;
    if(!originalText.has(node))originalText.set(node,node.nodeValue);
    node.nodeValue=translateText(originalText.get(node));
  }
  root.querySelectorAll('[placeholder],[aria-label]').forEach(el=>{
    if(el.closest('.language-switch')||el===root)return;
    for(const attr of ['placeholder','aria-label']){
      if(!el.hasAttribute(attr))continue;
      const marker='data-original-'+attr;
      if(!el.hasAttribute(marker))el.setAttribute(marker,el.getAttribute(attr));
      el.setAttribute(attr,translateText(el.getAttribute(marker)));
    }
  });
  const problemInput=root.querySelector('input[data-key="problem"]');
  if(problemInput&&state.problem===defaultProblem)problemInput.value=translateText(defaultProblem);
  root.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===state.locale)));
}

window.addEventListener('message',event=>{
  if(event.source!==window.parent)return;
  if(event.data?.type==='surface-paper-selected'){try{paperReading.addPaper(event.data.paper);state.page='define';render();save();}catch(error){message.textContent=error.message;}}
  if(event.data?.type==='surface-paper-analysis-result'){const pending=analysisRequests.get(event.data.requestId);if(!pending)return;clearTimeout(pending.timer);analysisRequests.delete(event.data.requestId);if(event.data.error)pending.reject(new Error(event.data.error));else pending.resolve(event.data.analysis);}
});
window.parent.postMessage({type:'surface-paper-reader-ready'},'*');
if(state.research&&window.openai?.statePersistence==='local')researchPlanner.setStorage('saved');
function render(){const previousSourceScroll=root.querySelector('.source-list')?.scrollTop||0;const f={db,plan,model,define,inputs,cluster,results,post};if(!f[state.page])state.page='db';view.innerHTML=f[state.page]();localize();const sourceList=root.querySelector('.source-list');if(sourceList){sourceList.scrollTop=previousSourceScroll;const selected=sourceList.querySelector('.dbitem.selected');if(selected){const top=selected.offsetTop,bottom=top+selected.offsetHeight;if(top<sourceList.scrollTop)sourceList.scrollTop=top;else if(bottom>sourceList.scrollTop+sourceList.clientHeight)sourceList.scrollTop=bottom-sourceList.clientHeight;}}const modelHost=root.querySelector('#sl-paper-model-host');if(modelHost)paperModel.mount(modelHost);const plannerHost=root.querySelector('#sl-planner-host');if(plannerHost)researchPlanner.mount(plannerHost);const readingHost=root.querySelector('#sl-paper-reading-host');if(readingHost)paperReading.mount(readingHost);const assistantHost=root.querySelector('#sl-research-assistant-host');if(assistantHost)researchAssistant.mount(assistantHost);const structureHost=root.querySelector('#sl-structure-host');if(structureHost)structureViewer.mount(structureHost,state.locale);root.querySelectorAll('.nav').forEach(x=>x.setAttribute('aria-current',(x.dataset.go===state.page||(x.dataset.go==='define'&&['model','plan'].includes(state.page)))?'page':'false'));message.textContent='';if(globalThis.lucide)lucide.createIcons();}
function download(name,data,type='text/plain'){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);message.textContent=name+' '+translateText('생성됨 · 브라우저 다운로드 지원 여부에 따라 저장됩니다.');}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){state.page=b.dataset.go;render();save();return;}if(b.dataset.source){state.selected=b.dataset.source;render();save();return;}if(b.dataset.file){state.file=b.dataset.file;render();return;}switch(b.dataset.action){case 'paper-model':state.selected='L01';state.page='model';render();save();break;case 'find-papers':window.parent.postMessage({type:'surface-paper-search',query:state.query.trim()||'nitrogen incorporation diamond'},'*');break;case 'related-papers':window.parent.postMessage({type:'surface-paper-search',query:translateText(state.problem).trim()||'nitrogen incorporation diamond'},'*');break;case 'use-source':state.page='define';researchAssistant.linkSource(state.selected);researchPlanner.linkSource(state.selected);state.research=researchPlanner.snapshot();render();save();break;case 'generate':files=makeFiles();state.generated=true;state.file=Object.keys(files)[0];render();save();break;case 'download-input':{const name=Object.hasOwn(files,state.file)?state.file:Object.keys(files)[0];download(name,files[name]);break;}case 'advance':state.stage=state.stage>=5?1:state.stage+1;if(state.stage===5)state.result=true;render();save();break;case 'cancel':state.stage=0;render();message.textContent=translateText('시연 작업을 취소했습니다. 실제 서버 작업은 없습니다.');save();break;case 'fixture':state.result=true;render();save();break;case 'archive':message.textContent=translateText('목업 저장 시연: 합성 데이터 표식을 유지합니다. 실제 DB에 기록하지 않습니다.');break;case 'exportdb':download('surface-literature-seed.json',JSON.stringify({date:'2026-11-16',scope:'nitrogen incorporation into the diamond lattice and surface effects during CVD growth',quantitative_barriers_verified:false,language:state.locale,sources:state.locale==='en'?JSON.parse(translateText(JSON.stringify(sources))):sources,reaction_candidates:reactions.map(r=>({id:r[0],name:r[1],purpose:translateText(r[2]),sources:r[3],required:translateText(r[4]),barrier_eV:null}))},null,2),'application/json');break;case 'post':state.post=true;render();save();break;case 'export-post':download('kinetics-demo.json',JSON.stringify({status:'synthetic-example-not-validated',source:'user-adjustable-demo',method:'TST',kappa:1,deltaG_barrier_eV:Number(state.dg),temperature_K:Number(state.temp),rate_unit:'s^-1',comsol_ready:false,missing:['temperature-dependent free energy','site density','coverage model','reaction stoichiometry and surface flux mapping']},null,2),'application/json');break;case 'export-csv':{const ts=[900,1000,1100,1200,1300];download('kinetics-demo.csv','status,T_K,assumed_deltaG_eV,k_per_s'+nl+ts.map(t=>`synthetic_constant_deltaG_example,${t},${state.dg},${(2.083661912e10*t*Math.exp(-Number(state.dg)/(8.617333262e-5*t))).toExponential(8)}`).join(nl),'text/csv');break;}}});
root.addEventListener('change',e=>{const key=e.target.dataset.key;if(!key)return;const numeric=['cutoff','rho','force','charge','vacuum','layers','base','nodes','ranks','temp','dg','relaxKx','relaxKy','relaxKz','dosKx','dosKy','dosKz'];state[key]=numeric.includes(key)?Number(e.target.value):e.target.value;if(key==='engine'){state.cutoff=state.engine==='VASP'?500:60;state.scf=state.engine==='VASP'?'1e-6':'1e-8';if(state.engine!=='VASP'&&state.task==='dos')state.task='relax';state.file='';}if(!['source','temp','dg','filter'].includes(key)){state.stage=0;state.generated=false;files={};}if(['source','temp','dg'].includes(key))state.post=false;render();save();});
root.addEventListener('input',e=>{if(e.target.id==='sl-search'){state.query=e.target.value;const pos=e.target.selectionStart;render();const el=root.querySelector('#sl-search');el.focus();el.setSelectionRange(pos,pos);}});
window.addEventListener('openai:set_globals',e=>{if(!savingState&&e.detail?.globals?.widgetState&&e.detail.globals.widgetState.privateContent?.writer!==stateWriter){applySaved(e.detail.globals.widgetState);render();}});
render();
})();
</script>
</div>
